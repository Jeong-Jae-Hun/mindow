name: Mindow
options:
  deploymentTarget:
    macOS: "14.0"
packages:
  MindowCore:
    path: MindowCore
targets:
  Mindow:
    type: application
    platform: macOS
    sources: [App]
    dependencies:
      - package: MindowCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.jeong-jae-hun.mindow
        MARKETING_VERSION: 0.1.0
        CURRENT_PROJECT_VERSION: 1
        SWIFT_VERSION: "6.0"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_LSUIElement: YES
        INFOPLIST_KEY_NSHumanReadableCopyright: "MIT License"
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_IDENTITY: "-"
