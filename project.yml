name: Mindow
options:
  deploymentTarget:
    macOS: "14.0"
packages:
  MindowCore:
    path: MindowCore
  KeyboardShortcuts:
    url: https://github.com/sindresorhus/KeyboardShortcuts
    exactVersion: 3.1.0
targets:
  Mindow:
    type: application
    platform: macOS
    sources: [App]
    dependencies:
      - package: MindowCore
      - package: KeyboardShortcuts
    # Build settings can't declare URL types, so they live in this file, which Xcode
    # merges with the Info.plist GENERATE_INFOPLIST_FILE builds from INFOPLIST_KEY_*.
    # XcodeGen writes 1.0 and 1 for the versions otherwise, so they point at the settings.
    info:
      path: App/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleURLTypes:
          - CFBundleURLName: io.github.jeong-jae-hun.mindow
            CFBundleURLSchemes: [mindow]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.jeong-jae-hun.mindow
        MARKETING_VERSION: 0.3.0
        CURRENT_PROJECT_VERSION: 4
        SWIFT_VERSION: "6.0"
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
        INFOPLIST_KEY_LSUIElement: YES
        INFOPLIST_KEY_NSHumanReadableCopyright: "MIT License"
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_IDENTITY: "-"
